name: tutormatch
description: Plataforma de asesorias academicas universitarias
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP y API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Estado global
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navegacion
  go_router: ^13.2.0

  # Supabase (Realtime + Auth)
  supabase_flutter: ^2.3.4

  # Almacenamiento local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Stripe
  flutter_stripe: ^10.1.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Utilidades
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5

  # Socket.io
  socket_io_client: ^2.0.3+1

  # Iconos
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
